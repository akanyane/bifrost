# Opens/updates a Release PR from Conventional Commits on main.
# Merging that PR bumps the version, updates CHANGELOG.md and creates the GitHub release + tag.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
